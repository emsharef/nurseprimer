# The Fifth Night
images:
  - id: ch05-opener
    aspect: '16:9'
    refs: [sheet-you, sheet-bea, sheet-wick]
    alt: In the empty day room at night, you kneel on the floor among hundreds of paper message slips, sorting them into little islands like a map, while Bea, mug in hand, points to a gap between two clusters and Wick watches from the back of a chair.
    prompt: >
      Night scene in an empty hospital children's day room, chairs pushed back to the walls, low toy shelves in
      shadow, a tall window with dark blue night outside, a single lamp casting warm gold light across the floor.
      The young nurse kneels on the floor among hundreds of small blank paper slips, arranging them into
      separate little islands and clusters spread across the floorboards, like a map of an archipelago, with
      lengths of string running between some clusters. The charge nurse stands at the edge holding a mug,
      pointing down thoughtfully at a gap between two islands. The small clockwork owl perches on the back of a
      wooden chair, eyes glowing a faint teal, looking down at the map. The paper slips carry no writing, only
      faint grey scribble lines. Quiet, absorbed, a little magical.

  - id: ch05-island
    aspect: '3:2'
    refs: [sheet-wick]
    alt: A close view of one paper island on the floor. A purple felt-tip pen lies among the slips about rashes, as if it belonged there, and Wick peers down at it.
    prompt: >
      Close, low view of the floor at night in warm lamplight: a tight little cluster of blank paper slips with
      faint grey scribble lines, and lying right in the middle of them, as if it belonged there, an uncapped
      purple felt-tip pen with a small purple smudge on one slip. The small clockwork owl stands at the edge of
      the cluster, head tilted, peering down at the pen with teal glowing eyes, puzzled. Shallow depth of field,
      other paper islands soft and out of focus in the background. No legible text anywhere.
